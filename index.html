<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Interactive Shopping List</h1>

        <div class="input-section">
            <input type="text" id="itemName" placeholder="Enter item name">

            <input type="number" id="itemPrice" placeholder="Enter price" step="0.01">

            <button id="addButton">Add</button>
        </div>

        <ul id="shoppingList"></ul>

        <h2>Total Purchased: ksh <span id="totalCost">ksh 0.00</span></h2>

        <button id="clearButton">Clear List</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
